# Minimal Supabase local config for DHub.
# Do not store secrets in this repository.

project_id = "dhub"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/redefinir-senha", "http://localhost:5173/redefinir-senha"]
enable_signup = false
